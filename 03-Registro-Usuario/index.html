<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Appwise</title>
</head>
<body>
    <h1>Únete a la Comunidad Appwise</h1>

    <form action="#">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" required>

        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="clave">Contraseña</label>
        <input type="password" name="" id="clave" required>

        <hr>

        <label for="fecha-nacimiento">Fecha de nacimiento</label>
        <input type="date" id="fecha-nacimiento" required>

        <label for="exp">Nivel de experiencia</label>
        <select name="" id="exp" required>
            <option value="Trainee">Trainee</option>
            <option value="Junior">Junior</option>
            <option value="Semi-Senior">Semi-Senior</option>
        </select>

        <hr>

        <h3>¿Cuál es tu especialidad favorita?</h3>
        <input type="radio" name="especialidad">Frontend
        <input type="radio" name="especialidad">Backend

        <hr>

        <label for="terminos-condiciones">Acepto los términos y condiciones</label>
        <input type="checkbox" name="" id="terminos-condiciones" required>

        <button type="submit">Crear cuenta</button>
    </form>
</body>
</html>
