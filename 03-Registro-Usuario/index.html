<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Appwise</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Únete a la Comunidad Appwise</h1>
        <form action="#">
            <label for="nombre">Nombre Completo</label>
            <input class="input-text" type="text" id="nombre" placeholder="Martin Guerrero" required>
            <label for="email">Email</label>
            <input class="input-text" type="email" id="email" placeholder="guerreromartin@gmail.com" required>
            <label for="clave" >Contraseña</label>
            <input class="input-text" type="password" name="" id="clave" placeholder="**********" required>
            <hr>
            <label for="fecha-nacimiento" class="labelNacimiento">Fecha de nacimiento</label>
            <input class="input-text" type="date" id="fecha-nacimiento" required>
            <label for="exp">Nivel de experiencia</label>
            <select name="" id="exp" required>
                <option value="Trainee">Trainee</option>
                <option value="Junior">Junior</option>
                <option value="Semi-Senior">Semi-Senior</option>
            </select>
            <hr>
            <label class="especialidad-label">¿Cuál es tu especialidad favorita?</label>
            <div class="especialidad">
                <input class="input-radio" type="radio" name="especialidad" id="especialidad">
                <label for="especialidad" class="input-radio">Frontend (Diseño e interfaz)</label>
            </div>
            <div class="especialidad">
                <input class="input-radio" type="radio" name="especialidad">
                <label for="especialidad" class="input-radio">Backend (Lógica y bases de datos)</label>
            </div>         
            <hr>
            <div class="terms">
                <input type="checkbox" name="" id="terminos-condiciones" required>
                <label for="terminos-condiciones">Acepto los términos y condiciones</label>
            </div>
            <button type="submit">Crear cuenta</button>
        </form>
    </div>
</body>
</html>
