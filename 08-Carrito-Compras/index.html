<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Appwise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
            <h1>Appwise Store</h1>
            <button type="button" >🛒 Ver Carrito (<span class="btnCarrito">0</span>)</button>
    </header>

    <main>
        <div class="tienda">
            <section class="productos">
                    <h2>Nuestro productos</h2>
                    <div class="grillaProductos">
                        <div class="cartaProducto">
                            <img src="assets/auricular_gamer.webp" alt="">
                            <h3>Auticular gamer</h3>
                            <p><b>$75000</b></p>
                            <button type="button" class="btnAgregar">Añadir al carrito</button>
                        </div>
            
                        <div class="cartaProducto">
                            <img src="assets/mouse_gamer.webp" alt="">
                            <h3>Mouse gamer</h3>
                            <p><b>$38000</b></p>
                            <button type="button" class="btnAgregar">Añadir al carrito</button>
                        </div>
            
                        <div class="cartaProducto">
                            <img src="assets/teclado_mecanico.webp" alt="">
                            <h3>Teclado mecánico gasdasdas sads amer</h3>
                            <p><b>$62000</b></p>
                            <button type="button" class="btnAgregar">Añadir al carrito</button>
                        </div>
                </div>
            </section>
            <aside class="carrito">
                <h2>Resumen de compra</h2>
                <ul class="listaCarrito">
                    <li>
                        <p>ELIGE UN PRODUCTO QUE QUIERAS COMPRAR</p>
                    </li>
                </ul>
                <h4 class="total">Total: 0</h4>
                <button type="button" class="finishBtn">Finalizar compra</button>
            </aside>
        </div>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
