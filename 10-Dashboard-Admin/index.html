<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Appwise</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <aside>
        <h2 class="title">🚀 Appwise Admin</h2>
        <nav>
            <ul class="list">
                <li class="list-item"><button class="dashboard-item">📊 Dashboard</button></li>

                <li class="list-item">
                    <details class="acordeonProyectos acordeon">
                        <summary>📋 Proyectos</summary>
                        <ul class="sublist proyectos">
                        </ul>
                    </details>
                </li>

                <li class="list-item">
                    <details class="acordeonMinijuegos acordeon">
                        <summary>🕹️ Minijuegos</summary>
                        <ul class="sublist minijuegos">
                        </ul>
                    </details>
                </li>
            </ul>
        </nav>
    </aside>


    
    <main>
        <header>
            <input type="search" name="" id="" class="searcher" placeholder="Buscar proyecto/minijuego...">
            <div class="profile">
                <p>Hola, <span class="profile-username">Admin</span></p>
                <img src="assets/avatar.png" alt="" height="50px" width="50px">
            </div>
        </header>

        <section class="main-content">
            <iframe src="./dashboard.html" frameborder="0" class="dashboard-render"></iframe>

            <iframe src="" frameborder="0" class="proyect-render" hidden></iframe>
        </section>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
