<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio de Empleado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div>
            <h1>Directorio Interno - Appwise</h1>
            <p>Este es el directorio oficial de los empleados de Appwise</p>
        </div>
        
        <table border="1">
            <thead>
                <tr>
                    <td><h4>ID</h4></td>
                    <td><h4>Nombre</h4></td>
                    <td><h4>Puesto</h4></td>
                    <td><h4>Email</h4></td>
                </tr>
            </thead>

            <tbody class="tbody">
            </tbody>

            <tfoot>
                <tr>
                    <td colspan="4">
                        Total de personal activo: <span class="conteoEmpleados">3</span> empleados
                    </td>
                </tr>
            </tfoot>
        </table>
    </main>

    <script src="app.js"></script>
</body>
</html>
