<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <sectio class="card">
        <h1 class="tittle">Mis tareas pendientes</h1>

        <form class="addTask" id="form">
            <input type="text" placeholder="¿Qué necesitas hacer hoy?" id="inputTask">
            <button type="submit">Agregar tarea</button>
        </form>

        <ul class="tasks">
            <li>
                <span>
                    <input class="checkbox" type="checkbox">
                    <p>Estudiar etiquetas semánticas</p>
                </span>
                <button type="button">❌</button>
            </li>
            <li>
                <span>
                    <input class="checkbox" type="checkbox" checked>
                    <p>Tomas 2 litros de agua</p>
                </span>
                <button>❌</button>
            </li>
            <li>
                
                <span>
                    <input class="checkbox" type="checkbox">
                    <p>Avanzar en el proyecto de Github</p>
                </span>
                <button>❌</button>
            </li>
        </ul>

        <div class="info">
            <p>Tienes <span id="pendingTasks" style="font-weight: bold;">2</span> tareas pendientes.</p>
            <button type="button" class="clearCompleted">Limpiar completadas</button>
        </div>
    </section>


    <script src="app.js"></script>
</body>
</html>
