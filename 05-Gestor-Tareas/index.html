<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <h1>Mis tareas pendientes</h1>

        <div>
            <input type="text" placeholder="¿Qué necesitas hacer hoy?">
            <button type="button">Agregar tarea</button>
        </div>

        <ul>
            <li>
                <span>Sacar la basura</span>
                <input type="checkbox">
                <button>🗑️</button>
            </li>
            <li>
                <span>Tender la ropa</span>
                <input type="checkbox" checked>
                <button>🗑️</button>
            </li>
            <li>
                <span>Limpiar el piso</span>
                <input type="checkbox">
                <button>🗑️</button>
            </li>
            <p>Tienes 2 tareas pendientes</p>
        </ul>

        <button type="button">
            Limpiar completadas
        </button>
    </main>
</body>
</html>
