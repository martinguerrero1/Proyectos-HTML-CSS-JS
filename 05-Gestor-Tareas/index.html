<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="card">
        <h1>Mis tareas pendientes</h1>

        <div class="addTask">
            <input type="text" placeholder="¿Qué necesitas hacer hoy?" id="taskInput">
            <button id="addTaskButton">Agregar tarea</button>
        </div>

        <ul class="board">
            <li class="noTasks">
                <p>AGREGA UNA TAREA ARRIBA</p>
            </li>
        </ul>

        <div class="footer">
            <p>
                Tienes <span id="pendingTasks">2</span> tareas pendientes.
            </p>
            <button type="button" class="clearCompleted">Limpiar completadas</button>
        </div>
    </section>


    <script type="module" src="./js/App.js"></script>
</body>
</html>
